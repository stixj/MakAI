name: Frontend checks
on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-checks.yml']
  push:
    branches: [main, 'codex/makai-ux-flow']
    paths: ['frontend/**', '.github/workflows/frontend-checks.yml']
permissions:
  contents: read
concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build
        env:
          VITE_JOB_SOURCE: local
      - run: npm run build:cloud
        env:
          VITE_JOB_SOURCE: cloud
